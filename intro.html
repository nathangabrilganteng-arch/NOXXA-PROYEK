<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAELGHUB · Intro</title><link rel="stylesheet" href="style.css"><style>body{margin:0;min-height:100vh;background:url('spiderman2.jpg') center/cover fixed;color:#fff;font-family:Inter,Arial,sans-serif;display:grid;place-items:center}body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,8,16,.72),rgba(5,8,16,.95));z-index:-1}.intro{width:min(92%,520px);text-align:center;padding:36px 24px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(10,18,35,.76);backdrop-filter:blur(18px);box-shadow:0 25px 80px #0008}.logo{width:92px;height:92px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff1744,#7c3aed);font-size:42px}.eyebrow{margin-top:18px;font-size:12px;letter-spacing:3px;opacity:.65}.title{font-size:34px;font-weight:900;margin:8px 0}.hello{font-size:18px;opacity:.9}.bar{height:6px;background:#ffffff14;border-radius:99px;overflow:hidden;margin:26px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff1744,#00d4ff);animation:load 2.2s forwards}@keyframes load{to{width:100%}}button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff1744,#7c3aed);color:white;font-weight:800;cursor:pointer}</style></head><body data-feature="NAELGHUB_INTRO_SEPARATE_AUDIO"><div id="introScreen"><video id="loginIntroVideo" autoplay muted playsinline preload="auto"><source src="VID-20260802-WA0079.mp4" type="video/mp4"></video><audio id="loginIntroAudio" src="intro-login-native.mp3" preload="auto"></audio><div class="introShade"></div><main class="intro"><div class="logo">🕷️</div><div class="hello">Halo, <b id="name">User</b> 👋</div><div class="bar"><div class="fill"></div></div><button onclick="go()">LANJUT KE DASHBOARD</button></main><button id="skipLoginIntro" type="button">SKIP INTRO ⏭</button></div><style>#introScreen{position:fixed;inset:0;overflow:hidden;background:#05070d;color:#fff}#loginIntroVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75;filter:blur(1px)}.introShade{position:absolute;inset:0;background:rgba(0,0,0,.48);backdrop-filter:blur(2px)}#loginIntroAudio{display:none}.intro{position:relative;z-index:3;margin:0 auto;top:50%;transform:translateY(-50%);max-width:520px;padding:28px;text-align:center;background:rgba(8,12,22,.48);border:1px solid rgba(255,255,255,.18);border-radius:24px;backdrop-filter:blur(12px)}#skipLoginIntro{position:fixed;z-index:5;right:18px;bottom:18px;padding:10px 16px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(0,0,0,.58);color:#fff;font-weight:800;backdrop-filter:blur(8px)}@media(max-width:600px){.intro{margin:0 18px}}</style><script>const s=JSON.parse(localStorage.getItem('naelghub_session')||'null');if(!s||!s.username){location.href='login.html'}else{document.getElementById('name').textContent=s.username}const v=document.getElementById('loginIntroVideo'),a=document.getElementById('loginIntroAudio'),b=document.getElementById('skipLoginIntro');let done=false;function go(){location.href='dashboard.html'}function finish(){if(done)return;done=true;try{v.pause();a.pause()}catch(e){}go()}b.addEventListener('click',finish);v.addEventListener('ended',finish);const play=()=>a.play().catch(()=>{});window.addEventListener('load',play,{once:true});document.addEventListener('pointerdown',play,{once:true});setTimeout(()=>{if(!v||v.ended)finish()},35000);</script></body></html>
